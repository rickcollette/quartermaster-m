[package]
name = "quartermaster-m"
version = "1.0.33"
description = "QuarterMaster/M ATASCII text and screen editor"
authors = ["Rick Collette"]
edition = "2021"
license = "GPL-2.0-or-later"

[lib]
name = "quartermaster_m_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quartermaster-m"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atascii = { path = "../vendor/atascii" }
broadside-core = { path = "../vendor/broadside-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
